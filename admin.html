<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administration — Rasen</title><style>body{font-family:system-ui,sans-serif;background:#f4f7f2;color:#17271f;margin:0;padding:18px}.wrap{max-width:850px;margin:auto}h1{color:#176b4d}input,button{font:inherit;padding:11px;border-radius:9px;border:1px solid #ccd7cd}button{cursor:pointer;background:#176b4d;color:white;border:0;font-weight:700;margin:4px}.item{background:white;border:1px solid #dce5dc;border-radius:13px;padding:16px;margin:12px 0;overflow-wrap:anywhere}.muted{color:#63746a;font-size:13px}.row{display:flex;gap:8px;flex-wrap:wrap}.danger{background:#9c3434}.warn{background:#8b6200}</style></head><body><main class="wrap"><h1>Rasen Marketplace + Rasen News</h1><p>Administration : saisis la clé secrète configurée dans Netlify. Les contenus sont en attente jusqu’à validation.</p><div class="row"><input id="key" type="password" placeholder="Clé d’administration" style="flex:1;min-width:220px"><button onclick="load()">Charger les contenus en attente</button></div><p id="msg" class="muted"></p><div id="items"></div></main><script>async function load(){const key=document.getElementById('key').value;const out=document.getElementById('items'),msg=document.getElementById('msg');out.innerHTML='';msg.textContent='Chargement…';try{let all=[];for(const kind of ['listings','news']){const r=await fetch('/.netlify/functions/admin?kind='+kind,{headers:{'x-admin-key':key}});if(!r.ok)throw Error('Accès refusé ou endpoint non activé');const j=await r.json();all=all.concat(j.items||[])}msg.textContent=all.length+' contenu(s) en attente.';if(!all.length){out.innerHTML='<p>Aucun contenu en attente.</p>';return}out.innerHTML=all.map(x=>`<article class="item"><div class="muted">${x.kind==='listing'?'ANNONCE':'RASEN NEWS'} · ${new Date(x.created_at).toLocaleString('fr-FR')} · ${x.id}</div><h3>${esc(x.title)}</h3><p>${esc(x.desc||x.body||'')}</p><p class="muted">${esc(x.name||x.author_name||'')} · ${esc(x.location||x.category||'')} · ${esc(x.contact||'')}</p><button onclick="moderate('${x.id}','published')">Publier</button><button class="danger" onclick="moderate('${x.id}','rejected')">Refuser</button></article>`).join('')}catch(e){msg.textContent=e.message;}}function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function moderate(id,status){try{const r=await fetch('/.netlify/functions/content',{method:'POST',headers:{'Content-Type':'application/json','x-admin-key':document.getElementById('key').value},body:JSON.stringify({action:'moderate',id,status})});const j=await r.json();if(!r.ok)throw Error(j.error||'Erreur');load()}catch(e){alert(e.message)}}
</script></body></html>
